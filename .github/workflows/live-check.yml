# Runs check-live.mjs on GitHub's own servers every 6 hours: is the live mrcopytrading.com running the code published here?
# The result is written to LIVE-CHECK.md (date + link to this run). Anyone can start it by hand: Actions → Live check → Run.
name: Live check
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "check-live.mjs", ".github/workflows/live-check.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the live site against the published code
        id: check
        run: node check-live.mjs
        continue-on-error: true
      - name: Save the result (LIVE-CHECK.md)
        run: |
          git config user.name "live-check"
          git config user.email "live-check@users.noreply.github.com"
          git add LIVE-CHECK.md
          git commit -m "Live check $(date -u +'%Y-%m-%d %H:%M') UTC" || exit 0
          git pull --rebase && git push
      - name: Fail the run if the check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
